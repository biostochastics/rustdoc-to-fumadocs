name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "22 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run typecheck
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24, 26]
        include:
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:run
        if: matrix.node != 24 || matrix.os != 'ubuntu-latest'
      - run: npm run test:coverage
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
  rustdoc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          ["1.76.0", "1.80.0", "1.83.0", "1.86.0", "1.89.0", "1.92.0", "1.94.0", stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install "${{ matrix.rust }}" --profile minimal
      - run: RUSTDOC="$(rustup which --toolchain "${{ matrix.rust }}" rustdoc)" bash scripts/test-rust.sh
      - run: npm run test:crates -- itoa serde_core
        if: matrix.rust == 'stable'
  fumadocs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: [14, 15, 16, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - run: npm run test:fumadocs -- "${{ matrix.major }}"
