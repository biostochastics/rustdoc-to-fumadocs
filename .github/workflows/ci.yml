name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

jobs:
  checks:
    if: github.event.deleted != true
    timeout-minutes: 15
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run typecheck
      - run: npm run test:coverage
      - name: Build and smoke-test the installed package
        run: npm run test:package
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.event_name != 'pull_request'
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
  test:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubicloud-standard-2]
        node: ["20.19.0", "22.12.0", "26"]
        include:
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:run
  rustdoc:
    name: Rust ${{ matrix.toolchains }}
    needs: checks
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    timeout-minutes: 30
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        toolchains:
          - "1.76.0 1.80.0 1.83.0"
          - "1.86.0 1.89.0 1.92.0"
          - "1.94.0 1.98.0 1.100.0"
          - "stable nightly"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate and convert rustdoc JSON for each toolchain
        env:
          TOOLCHAINS: ${{ matrix.toolchains }}
        shell: bash
        run: |
          read -ra versions <<< "$TOOLCHAINS"
          result=0
          for version in "${versions[@]}"; do
            echo "::group::Rust $version"
            if ! (rustup toolchain install "$version" --profile minimal &&
                  RUSTDOC="$(rustup which --toolchain "$version" rustdoc)" npm run test:rust); then
              echo "::error::Rust $version compatibility check failed"
              result=1
            fi
            echo "::endgroup::"
          done
          exit "$result"
      - name: Convert third-party crates with stable Rust
        if: matrix.toolchains == 'stable nightly'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: npm run test:crates
  fumadocs:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    timeout-minutes: 30
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        major: [14, 15, 16, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - run: npm run test:fumadocs -- "${{ matrix.major }}"
